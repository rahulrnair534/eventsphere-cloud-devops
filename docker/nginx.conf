server {
  listen 80; root /var/www/html; index index.php; client_max_body_size 3m;
  location ~ ^/(includes|database|docker)/ { deny all; }
  location ~ /\.(?!well-known) { deny all; }
  location ~* \.(sql|md|yml|example|env)$ { deny all; }
  location ~* ^/uploads/.*\.php$ { deny all; }
  location ~ /_nav\.php$ { deny all; }
  location / { try_files $uri $uri/ =404; }
  location ~ \.php$ { include fastcgi_params; fastcgi_pass app:9000; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; }
  location ~* \.(css|js|jpg|png|webp)$ { expires 7d; }
}
