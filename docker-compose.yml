services:
  app:
    build: .
    env_file: .env
    volumes: ["./:/var/www/html"]
    depends_on: [db]
  web:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./:/var/www/html:ro", "./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
  # Local MySQL only. On AWS, DELETE this service and point DB_HOST to your RDS endpoint.
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes: ["dbdata:/var/lib/mysql", "./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
volumes:
  dbdata:
