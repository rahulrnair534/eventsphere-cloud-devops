name: Deploy EventSphere

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-039a62422beccafb5 \
            --document-name AWS-RunShellScript \
            --comment "Deploy EventSphere from GitHub Actions" \
            --parameters 'commands=["sudo -u ec2-user bash -lc '\''cd /home/ec2-user/eventsphere-cloud-devops && git pull --ff-only origin main && sudo docker compose up -d --build'\''"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-039a62422beccafb5 \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-039a62422beccafb5 \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-039a62422beccafb5 \
                --output json
              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out while waiting for SSM."
          exit 1
